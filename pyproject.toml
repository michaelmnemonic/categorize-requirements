[project]
name = "categorize-requirements"
version = "0.1.0"
description = "This project uses machine learning (SetFit - Sentence Transformer Fine-tuning) to automatically categorize software requirements into specific types, such as Security, Performance, and Functional-Safety."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.7.0",
    "setfit>=1.1.3",
    "transformers<5.0",
]

[tool.uv.build-backend]
module-name = "src"
module-root = ""
